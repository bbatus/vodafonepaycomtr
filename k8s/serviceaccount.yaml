apiVersion: v1
kind: ServiceAccount
metadata:
  name: vodafonepaycomtr
  namespace: vepas-ai-am
  labels: { app: vodafonepaycomtr }
imagePullSecrets:
  - name: vodafonepaycomtr-pull-secret
