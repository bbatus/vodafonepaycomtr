# ⚠️ 01.09.2026 Clover'da sahada bulundu: namespace'in paylaşılan
# `vodafone-githubtest` secret'ı "denied" ile patladı — arkasındaki hesabın
# yeni repolara (bu servisinki dahil) erişimi olmayabilir. Bunun yerine
# pipeline'ın PUSH için kullandığı — kesin erişimi olan — kimlikle kendi
